<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Homespire 360 Admin</title>
  <meta name="theme-color" content="#FFFFFF" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="admin">
  <header class="admin-bar">
    <div class="admin-bar-id">
      <div class="brandline"><span class="brand-dot"></span><span>Homespire 360</span></div>
      <h1>Admin</h1>
    </div>
    <div class="admin-bar-actions">
      <span id="status-pill" class="status-pill status-clean">No unsaved changes</span>
      <button class="btn btn-primary" id="export-btn" type="button"></button>
      <button class="btn btn-outline" id="copy-json-btn" type="button"></button>
      <a class="btn btn-outline" id="preview-draft-btn" href="index.html?draft=1"></a>
      <a class="btn btn-outline" id="view-app-btn" href="index.html"></a>
      <button class="btn btn-quiet" id="reset-btn" type="button"></button>
    </div>
  </header>

  <div class="conflict-bar" id="conflict-bar" hidden></div>

  <div class="admin-body">
    <aside class="admin-rail">
      <p class="rail-group">Setup</p>
      <div id="rail-setup"></div>

      <div class="rail-group-head">
        <p class="rail-group">Loan officers <span class="rail-count" id="rail-count"></span></p>
        <button class="rail-add" id="add-lo-btn" type="button" aria-label="Add loan officer"></button>
      </div>
      <div class="add-lo" id="add-lo-form" hidden></div>
      <div class="rail-filter" id="rail-filter" hidden></div>
      <div id="rail-los"></div>
    </aside>

    <main class="admin-detail" id="detail"></main>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/data.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
