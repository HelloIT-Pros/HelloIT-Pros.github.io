  <style id="splash-style">
    /*
     * Launch screen, inlined on purpose.
     *
     * It has to paint before styles.css and the app scripts arrive, otherwise
     * the first thing an LO sees is a white flash and the splash is pointless.
     * So the CSS is here, and the mark is a data URI rather than a file: a
     * splash that waits on a network request is not a splash.
     *
     * Palette and gradients are the 2026-2027 roadmap deck's own: a 160deg
     * deep-to-violet ground, fuchsia and violet radial glows, and the
     * white-to-lilac-to-pink gradient type from its hero.
     */
    #splash {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 22px;
      padding-bottom: 6vh;
      background: linear-gradient(160deg, #160329 0%, #370C66 100%);
      opacity: 1;
      transition: opacity 420ms ease;
    }

    /* Two soft glows, offset the way the deck places them. */
    #splash::before,
    #splash::after {
      content: "";
      position: absolute;
      /* vmax, so a tall phone does not get a glow wider than the screen.
         Kept restrained: the deck's ground reads deep with a hint of light,
         and a glow big enough to lift the whole canvas loses that. */
      width: 60vmax;
      height: 60vmax;
      border-radius: 50%;
      pointer-events: none;
    }
    #splash::before {
      top: -26vmax;
      left: -22vmax;
      background: radial-gradient(circle, rgba(217, 70, 239, 0.26), rgba(0, 0, 0, 0) 70%);
    }
    #splash::after {
      bottom: -30vmax;
      right: -24vmax;
      background: radial-gradient(circle, rgba(147, 51, 234, 0.3), rgba(0, 0, 0, 0) 70%);
    }

    #splash-mark {
      position: relative;
      width: 66px;
      height: auto;
      animation: splash-rise 620ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    #splash-word {
      position: relative;
      margin: 0;
      font: 700 25px/1.1 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      letter-spacing: -0.02em;
      background: linear-gradient(150deg, #ffffff 0%, #E9D5FF 42%, #F472B6 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: splash-rise 620ms 70ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    #splash-bar {
      position: relative;
      width: 108px;
      height: 2px;
      border-radius: 2px;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.14);
      animation: splash-rise 620ms 140ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    #splash-bar span {
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 2px;
      background: linear-gradient(92deg, #F472B6, #D946EF);
      animation: splash-sweep 1150ms 200ms cubic-bezier(0.4, 0, 0.2, 1) infinite;
    }

    @keyframes splash-rise {
      from { opacity: 0; transform: translateY(9px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes splash-sweep {
      from { transform: translateX(-120%); }
      to   { transform: translateX(320%); }
    }

    #splash.is-gone { opacity: 0; pointer-events: none; }

    /* Motion off means no rise, no sweep. The screen still appears and still
       gets out of the way. */
    @media (prefers-reduced-motion: reduce) {
      #splash-mark, #splash-word, #splash-bar { animation: none; }
      #splash-bar span { animation: none; width: 100%; }
      #splash { transition-duration: 160ms; }
    }
  </style>
