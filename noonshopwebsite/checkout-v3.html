<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout | Noon Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@200;300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --white:#FFFFFF;--cool:#F4F5F5;--stone:#EDEAE3;--ink:#1C1C1C;
  --line:rgba(28,28,28,.12);--mut:rgba(28,28,28,.72);--mut2:rgba(28,28,28,.56);
  --navy:#202A44;--navy-lt:#3D4F72;--navy-dk:#111828;
  --D:'Bebas Neue',sans-serif;--B:'Outfit',sans-serif;--P:'Playfair Display',Georgia,serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--white);color:var(--ink);font-family:var(--B);font-weight:400;-webkit-font-smoothing:antialiased;}
a{color:inherit;text-decoration:none;}img{display:block;max-width:100%;}

/* top bar */
.cbar{display:flex;justify-content:space-between;align-items:center;padding:20px 60px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--white);z-index:50;}
.cbar-logo{font-family:var(--D);font-size:20px;letter-spacing:.2em;color:var(--ink);display:flex;align-items:center;}
.cbar-logo-img{height:45px;width:auto;display:block;}
.cbar-secure{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);display:flex;align-items:center;gap:8px;}
.cbar-secure::before{content:'';width:8px;height:8px;border-radius:50%;background:#2e7d4f;}

/* layout */
.checkout{display:grid;grid-template-columns:1.15fr .85fr;min-height:calc(100vh - 61px);}
.left{padding:48px 60px 80px;max-width:680px;margin-left:auto;width:100%;}
.right{background:var(--cool);padding:48px 60px 80px;border-left:1px solid var(--line);}
.right-inner{max-width:460px;}

.steps{display:flex;gap:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut2);margin-bottom:36px;}
.steps b{color:var(--navy);font-weight:500;}

.csec{margin-bottom:40px;}
.csec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:18px;}
.csec-h h3{font-family:var(--D);font-size:24px;letter-spacing:.04em;}
.csec-h span{font-size:12px;color:var(--mut2);}
.field{margin-bottom:14px;}
.field label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut);margin-bottom:7px;}
.field input,.field select{width:100%;padding:14px 16px;border:1px solid var(--line);border-radius:8px;font-family:var(--B);font-size:15px;color:var(--ink);background:var(--white);}
.field input:focus,.field select:focus{outline:none;border-color:var(--navy);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.row3{display:grid;grid-template-columns:2fr 1fr 1fr;gap:14px;}

.pay-card{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.pay-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;background:var(--cool);font-size:12px;letter-spacing:.08em;color:var(--ink);}
.pay-head .cards{display:flex;gap:6px;}
.pay-head .cards span{font-size:9px;letter-spacing:.08em;border:1px solid var(--line);border-radius:4px;padding:3px 7px;color:var(--mut);background:#fff;}
.pay-body{padding:16px;}

.place{display:flex;align-items:center;justify-content:center;gap:11px;width:100%;background:var(--navy);color:#fff;font-size:13px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;padding:18px;border-radius:40px;border:none;cursor:pointer;margin-top:8px;transition:background .2s;}
.place:hover{background:var(--navy-lt);}
.back-cart{display:inline-flex;align-items:center;gap:8px;margin-top:20px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--navy);}

/* express */
.express{margin-bottom:28px;}
.express-btn{width:100%;padding:14px;border-radius:8px;border:none;color:#fff;font-size:14px;font-weight:500;letter-spacing:.04em;cursor:pointer;margin-bottom:10px;}
.express-shop{background:#5a31f4;}
.express-pay{background:#000;}
.express-divider{display:flex;align-items:center;gap:14px;color:var(--mut2);font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin:24px 0;}
.express-divider::before,.express-divider::after{content:'';flex:1;height:1px;background:var(--line);}

/* summary right */
.osum-item{display:flex;gap:16px;align-items:center;padding:16px 0;border-bottom:1px solid var(--line);}
.osum-img{width:64px;height:64px;background:var(--white);border:1px solid var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;position:relative;flex-shrink:0;}
.osum-img img{width:78%;object-fit:contain;}
.osum-qty{position:absolute;top:-8px;right:-8px;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;}
.osum-name{font-family:var(--D);font-size:19px;letter-spacing:.04em;line-height:1;}
.osum-meta{font-size:11px;color:var(--mut);margin-top:5px;}
.osum-price{margin-left:auto;font-size:14px;}
.osum-totals{margin-top:20px;}
.osum-row{display:flex;justify-content:space-between;font-size:14px;color:var(--mut);padding:8px 0;}
.osum-row.total{border-top:1px solid var(--line);margin-top:10px;padding-top:16px;font-size:18px;color:var(--ink);align-items:baseline;}
.osum-row.total span:last-child{font-family:var(--D);font-size:28px;}
.promo{display:flex;gap:10px;margin-top:18px;}
.promo input{flex:1;padding:12px 14px;border:1px solid var(--line);border-radius:8px;font-family:var(--B);}
.promo button{padding:12px 20px;border:1px solid var(--navy);background:none;color:var(--navy);border-radius:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;}
.osum-perk{display:flex;gap:10px;align-items:flex-start;font-size:12px;color:var(--mut);line-height:1.5;margin-top:14px;}
.osum-perk::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--navy);margin-top:5px;flex-shrink:0;}

/* confirmation */
.confirm{max-width:560px;margin:0 auto;padding:120px 24px;text-align:center;}
.confirm-check{width:72px;height:72px;border-radius:50%;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 28px;}
.confirm h1{font-family:var(--D);font-size:clamp(40px,6vw,72px);letter-spacing:.02em;line-height:.92;margin-bottom:16px;}
.confirm h1 em{font-family:var(--P);font-style:italic;font-weight:400;color:var(--navy);font-size:.55em;}
.confirm p{color:var(--mut);line-height:1.8;margin-bottom:14px;}

@media (max-width:960px){
  .cbar{padding:16px 22px;}
  .checkout{grid-template-columns:1fr;}
  .right{order:-1;border-left:none;border-bottom:1px solid var(--line);padding:28px 24px;}
  .left{padding:32px 24px 64px;}
  .right-inner,.left{max-width:none;}
}
</style>
</head>
<body>

<div class="cbar">
  <a href="index-v3.html" class="cbar-logo"><img src="NoonShopLogoEtsy.png" alt="Noon Shop" class="cbar-logo-img"></a>
  <div class="cbar-secure">Secure checkout</div>
</div>

<div id="app"></div>

<script>
const IMG='../Noonshop/assets/product/';
function getCart(){try{return JSON.parse(localStorage.getItem('noonCart')||'[]');}catch(e){return [];}}
function money(n){return '$'+n.toLocaleString();}

function renderCheckout(){
  const c=getCart();
  if(!c.length){
    document.getElementById('app').innerHTML=`<div class="confirm"><h1>Your bag is empty</h1><p>Add a frame to begin checkout.</p><a href="shop-v3.html" class="place" style="display:inline-flex;width:auto;padding:16px 32px;margin-top:20px;">Shop Frames →</a></div>`;
    return;
  }
  const subtotal=c.reduce((s,i)=>s+i.price*i.qty,0);
  const tax=Math.round(subtotal*0.06);
  const total=subtotal+tax;

  document.getElementById('app').innerHTML=`
  <div class="checkout">
    <div class="left">
      <div class="steps"><span>Bag</span> › <b>Information</b> › <span>Shipping</span> › <span>Payment</span></div>

      <div class="express">
        <button class="express-btn express-shop">Shop Pay</button>
        <button class="express-btn express-pay">Apple Pay</button>
        <div class="express-divider">or pay with card</div>
      </div>

      <div class="csec">
        <div class="csec-h"><h3>Contact</h3><span>Already have an account? Log in</span></div>
        <div class="field"><label>Email</label><input type="email" placeholder="you@email.com"></div>
      </div>

      <div class="csec">
        <div class="csec-h"><h3>Shipping Address</h3></div>
        <div class="row2">
          <div class="field"><label>First name</label><input placeholder="First name"></div>
          <div class="field"><label>Last name</label><input placeholder="Last name"></div>
        </div>
        <div class="field"><label>Address</label><input placeholder="Street address"></div>
        <div class="field"><label>Apartment, suite, etc. (optional)</label><input placeholder="Apt, suite"></div>
        <div class="row3">
          <div class="field"><label>City</label><input placeholder="City"></div>
          <div class="field"><label>State</label><input placeholder="State"></div>
          <div class="field"><label>ZIP</label><input placeholder="ZIP"></div>
        </div>
      </div>

      <div class="csec">
        <div class="csec-h"><h3>Payment</h3><span>All transactions secure & encrypted</span></div>
        <div class="pay-card">
          <div class="pay-head"><span>Credit card</span><div class="cards"><span>VISA</span><span>MC</span><span>AMEX</span></div></div>
          <div class="pay-body">
            <div class="field"><label>Card number</label><input placeholder="1234 1234 1234 1234"></div>
            <div class="row2">
              <div class="field"><label>Expiration (MM/YY)</label><input placeholder="MM / YY"></div>
              <div class="field"><label>Security code</label><input placeholder="CVC"></div>
            </div>
            <div class="field"><label>Name on card</label><input placeholder="Full name"></div>
          </div>
        </div>
        <button class="place" onclick="placeOrder()">Pay Now →</button>
        <a class="back-cart" href="cart-v3.html">← Return to bag</a>
      </div>
    </div>

    <div class="right">
      <div class="right-inner">
        ${c.map(i=>`
          <div class="osum-item">
            <div class="osum-img"><img src="${IMG}${i.img}" onerror="this.style.display='none'"><div class="osum-qty">${i.qty}</div></div>
            <div><div class="osum-name">${i.name.toUpperCase()}</div><div class="osum-meta">${i.coll}${i.color?' · '+i.color:''}${i.sku?' · '+i.sku:''} · ${i.weight}g</div></div>
            <div class="osum-price">${money(i.price*i.qty)}</div>
          </div>`).join('')}
        <div class="promo"><input placeholder="Discount code"><button>Apply</button></div>
        <div class="osum-totals">
          <div class="osum-row"><span>Subtotal</span><span>${money(subtotal)}</span></div>
          <div class="osum-row"><span>Shipping</span><span>Free</span></div>
          <div class="osum-row"><span>Estimated tax</span><span>${money(tax)}</span></div>
          <div class="osum-row total"><span>Total</span><span>${money(total)}</span></div>
        </div>
        <div class="osum-perk">Free shipping both ways, try them at home.</div>
        <div class="osum-perk">30-day fit guarantee, backed by Anna Park's clinical standard.</div>
      </div>
    </div>
  </div>`;
}

function placeOrder(){
  const c=getCart();
  const total=c.reduce((s,i)=>s+i.price*i.qty,0);
  const tax=Math.round(total*0.06);
  localStorage.removeItem('noonCart');
  document.getElementById('app').innerHTML=`
    <div class="confirm">
      <div class="confirm-check">✓</div>
      <h1>THANK YOU<br><em>your frames are on the way.</em></h1>
      <p>Order <strong>#NS-${Math.floor(100000+Math.random()*900000)}</strong> confirmed. A receipt is on its way to your inbox.</p>
      <p>Your frames ship with demo lenses fitted, simply take them to your optician to drop in your prescription, the way Anna Park intended.</p>
      <a href="index-v3.html" class="place" style="display:inline-flex;width:auto;padding:16px 34px;margin-top:24px;">Back to Noon Shop →</a>
    </div>`;
  window.scrollTo(0,0);
}
renderCheckout();
</script>
</body>
</html>
