<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Outfit', sans-serif; font-weight: 300;
  background: #F7F4EE;
  color: #1E1A14;
  display: grid; place-items: center;
  min-height: 100vh; padding: 24px;
  -webkit-font-smoothing: antialiased;
}
.gate {
  width: 100%; max-width: 400px; text-align: center;
}
.gate-mark {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 11px; letter-spacing: 0.36em; text-transform: uppercase;
  color: #9A7840; margin-bottom: 20px;
}
.gate-wordmark {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 56px; letter-spacing: 0.04em;
  color: #1E1A14; line-height: 1; margin-bottom: 4px;
}
.gate-wordmark span { color: #9A7840; }
.gate-sub {
  font-size: 13px; color: rgba(30,26,20,0.45);
  margin-bottom: 40px; line-height: 1.6;
}
.gate-divider {
  width: 40px; height: 0.5px; background: #9A7840;
  margin: 0 auto 40px;
}
.gate-form { display: flex; flex-direction: column; gap: 10px; }
.gate-input {
  width: 100%;
  background: #EFECE5;
  border: 0.5px solid #D0CAC0;
  color: #1E1A14; padding: 14px 16px;
  font-size: 14px; font-family: ui-monospace, monospace;
  letter-spacing: 0.08em; outline: none;
  transition: border-color 0.2s;
}
.gate-input:focus { border-color: #9A7840; }
.gate-input::placeholder { color: rgba(30,26,20,0.30); letter-spacing: 0.04em; }
.gate-button {
  background: #9A7840; color: #F7F4EE;
  border: 0; padding: 14px 16px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14px; letter-spacing: 0.22em; text-transform: uppercase;
  cursor: pointer; transition: background 0.15s;
}
.gate-button:hover { background: #7A5820; }
.gate-button[disabled] { opacity: 0.4; cursor: not-allowed; }
.gate-error {
  font-size: 11px; color: #B04040; min-height: 18px;
  margin-top: 4px; letter-spacing: 0.08em;
}
.gate-foot {
  font-size: 9px; letter-spacing: 0.22em; text-transform: uppercase;
  color: rgba(154,120,64,0.35); margin-top: 40px;
}
.spinner {
  display: inline-block; width: 12px; height: 12px;
  border: 1.5px solid rgba(247,244,238,0.3); border-top-color: #F7F4EE;
  border-radius: 50%; animation: spin 0.6s linear infinite;
  vertical-align: -2px; margin-right: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>

<div class="gate" id="gate">

    <button class="gate-button" id="submitBtn" type="submit">Unlock →</button>
    <div class="gate-error" id="errorMsg" aria-live="polite"></div>
  </form>
  <div class="gate-foot">Solis · May 2026 · Confidential</div>
</div>

function fromB64(b64) {
  const bin = atob(b64);
  return Uint8Array.from(bin, c => c.charCodeAt(0));
}

async function decrypt(password) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey(
    'raw', enc.encode(password), { name: 'PBKDF2' }, false, ['deriveKey']
  );
  const salt = fromB64(PAYLOAD.salt);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
    keyMaterial,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  const iv = fromB64(PAYLOAD.iv);
  const ciphertext = fromB64(PAYLOAD.ciphertext);
  const plaintext = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ciphertext);
  return new TextDecoder().decode(plaintext);
}

document.getElementById('gateForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  const err = document.getElementById('errorMsg');
  const pw  = document.getElementById('passwordInput').value;
  if (!pw) return;
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>Unlocking';
  err.textContent = '';
  try {
    const html = await decrypt(pw);
    document.open();
    document.write(html);
    document.close();
  } catch {
    err.textContent = 'Incorrect password. Please try again.';
    btn.disabled = false;
    btn.textContent = 'Unlock →';
    document.getElementById('passwordInput').value = '';
    document.getElementById('passwordInput').focus();
  }
});
</script>
