<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Homespire 360 — Homespire Mortgage</title>
  <meta name="description" content="Your one-stop shop for every link, portal, and shortcut you need at Homespire." />

  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#2E0A5A" />

  <!-- iOS home screen support (Safari ignores the manifest for some of this) -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Homespire 360" />

  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand"><span class="dot"></span><span id="brand-name">Homespire 360</span></div>
    <div class="identity">
      <img id="avatar" class="avatar" alt="" hidden />
      <div>
        <h1 id="greeting">Welcome</h1>
        <p class="subtitle" id="subtitle">Everything you need at Homespire, in one place.</p>
      </div>
    </div>
  </header>

  <div class="install-wrap" style="max-width:640px;margin:0 auto;padding:16px 16px 0;">
    <div class="install-banner" id="install-banner" hidden>
      <p class="install-copy">Install Homespire 360 for one-tap access.</p>
      <div class="actions">
        <button class="btn btn-primary install-action">Install</button>
        <button class="btn btn-ghost install-dismiss">Not now</button>
      </div>
    </div>
  </div>

  <main id="main"></main>

  <nav class="bottom-nav" id="bottom-nav" hidden>
    <button class="nav-item active" data-view="home"><span class="nav-icon">🏠</span>Home</button>
    <button class="nav-item" data-view="profile"><span class="nav-icon">👤</span>Profile</button>
  </nav>

  <p id="org-name" style="display:none"></p>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
